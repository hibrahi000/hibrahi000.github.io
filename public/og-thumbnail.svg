      <text x="48" y="23" text-anchor="middle" fill="#F5F5F7" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="14" font-weight="600">Node.js</text>

      <rect x="108" y="0" width="116" height="36" rx="10" fill="#181C26" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="166" y="23" text-anchor="middle" fill="#F5F5F7" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="14" font-weight="600">TypeScript</text>

      <rect x="236" y="0" width="166" height="36" rx="10" fill="#181C26" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="319" y="23" text-anchor="middle" fill="#F5F5F7" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="14" font-weight="600">Java / Spring Boot</text>

      <rect x="414" y="0" width="170" height="36" rx="10" fill="#181C26" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="499" y="23" text-anchor="middle" fill="#F5F5F7" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="14" font-weight="600">Apollo Federation</text>
    </g>

    <!-- Bottom Domain Pill + Pedigree -->
    <g transform="translate(0, 294)">
      <rect x="0" y="0" width="236" height="46" rx="23" fill="url(#bluePill)"/>
      <text x="118" y="29" text-anchor="middle" fill="#FFFFFF" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="15" font-weight="700">hibrahi000.github.io</text>

