    <rect x="206" y="0" width="190" height="170" rx="24" fill="url(#bentoSurface)" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.2"/>
    <text x="230" y="54" fill="#10B981" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="34" font-weight="800">-70%</text>
    <text x="230" y="84" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700">API Latency Cut</text>
    <text x="230" y="110" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">PostgreSQL &amp; Express</text>
    <text x="230" y="128" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">optimization (800ms</text>
    <text x="230" y="146" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">to 240ms) at BAE</text>

    <!-- Card 3: 99.9% SLA -->
    <rect x="0" y="186" width="190" height="170" rx="24" fill="url(#bentoSurface)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.2"/>
    <text x="24" y="240" fill="#38BDF8" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="34" font-weight="800">99.9%</text>
    <text x="24" y="270" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700">Zero-Downtime SLA</text>
    <text x="24" y="296" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">Top-3 contributor</text>
    <text x="24" y="314" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">migrating monolith</text>
    <text x="24" y="332" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">to Spring Boot</text>

    <!-- Card 4: 1M+ Users -->
    <rect x="206" y="186" width="190" height="170" rx="24" fill="url(#bentoSurface)" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.2"/>
    <text x="230" y="240" fill="#F59E0B" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="32" font-weight="800">1M+ Users</text>
    <text x="230" y="270" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700">Tier-0 Production</text>
    <text x="230" y="296" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">High-security defense</text>
    <text x="230" y="314" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">portals &amp; 500K+ daily</text>
    <text x="230" y="332" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">batch transactions</text>
