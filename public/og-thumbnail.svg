    <rect x="0" y="0" width="190" height="170" rx="24" fill="url(#bentoSurface)" stroke="#2997FF" stroke-opacity="0.3" stroke-width="1.2"/>
    <text x="24" y="54" fill="#2997FF" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="32" font-weight="800">8+ Teams</text>
    <text x="24" y="84" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700">Platform Standard</text>
    <text x="24" y="110" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">GraphQL validation &amp;</text>
    <text x="24" y="128" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">Spring Boot test</text>
    <text x="24" y="146" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">tooling at Amex</text>

