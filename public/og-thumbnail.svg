<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>

    <radialGradient id="azureGlow" cx="0.25" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="0.82" cy="0.78" r="0.5">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bentoSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181C26" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0F1219" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="titleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#2997FF"/>
    </linearGradient>

    <linearGradient id="bluePill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0077ED"/>
      <stop offset="100%" stop-color="#005BB5"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#azureGlow)"/>
  <rect width="1200" height="630" fill="url(#emeraldGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Outer Specular Bento Frame -->
  <rect x="44" y="42" width="1112" height="546" rx="32" fill="#0D1017" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
  <line x1="180" y1="42" x2="1020" y2="42" stroke="#2997FF" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Top Brand Header Inside Frame -->
  <g transform="translate(88, 86)">
    <!-- Terminal Icon Box -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="#0071E3" fill-opacity="0.2" stroke="#2997FF" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M15 18L22 24L15 30M25 30H33" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="64" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3">Hashmat Ibrahimi</text>
    <text x="64" y="42" fill="#86868B" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="13" font-weight="500">NEW YORK, NY  •  7+ YEARS EXPERIENCE</text>

    <!-- Status Pill (Top Right) -->
    <rect x="758" y="6" width="266" height="36" rx="18" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="780" cy="24" r="5" fill="#10B981"/>
    <text x="796" y="29" fill="#34D399" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="13" font-weight="600">MID-LEVEL &amp; SENIOR SWE</text>
  </g>

  <!-- Left Column: Main Value Proposition -->
  <g transform="translate(88, 178)">
    <text x="0" y="0" fill="#2997FF" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="13" font-weight="600" letter-spacing="2.2">BACKEND &amp; DISTRIBUTED SYSTEMS</text>

    <text x="0" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2">Software Engineer</text>
    <text x="0" y="106" fill="url(#titleAccent)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="42" font-weight="800" letter-spacing="-1">Built for Enterprise Scale.</text>

    <text x="0" y="152" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="18" font-weight="400">
